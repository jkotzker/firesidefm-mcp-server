version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Actions are pinned to releases at least two weeks old.
    cooldown:
      default-days: 14
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # @types/node tracks the oldest Node version in `engines`, so that typecheck rejects APIs it lacks.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
